[build-system]
# setuptools 77 : première version qui lit une licence en expression SPDX.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wmts2mbtiles"
version = "0.1.1"
description = "Fonds de carte en MBTiles à partir d'un service de tuiles WMTS ou XYZ (lidar2map, hike2gpx)"
readme = "README.md"
# Comme nico579-commons et gpx2elev : expression SPDX (PEP 639).
license = "GPL-3.0-or-later"
requires-python = ">=3.8"
# nico579-commons : chemin_part et les suffixes SQLite (module publication),
# les mêmes que pour toutes les applications.
dependencies = ["nico579-commons>=0.5,<1"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
# Pillow : conversion PNG vers JPEG et composition des transparences à la
# fusion ; sans lui, le producteur garde le PNG et la fusion remplace.
images = ["Pillow"]

[project.urls]
Source = "https://github.com/nico579/wmts2mbtiles"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
select = ["F"]
